name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cwd
          POSTGRES_PASSWORD: cwd
          POSTGRES_DB: cwd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cwd" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://cwd:cwd@localhost:5432/cwd
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: mypy app
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  build:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: sha-${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t $REGISTRY/cwd-api:$TAG backend
          docker build --platform linux/amd64 -t $REGISTRY/cwd-web:$TAG frontend
          docker push $REGISTRY/cwd-api:$TAG
          docker push $REGISTRY/cwd-web:$TAG
